name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: ["bug"]
body:
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was ist passiert, was hättest du erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachvollziehen
      placeholder: |
        1. Live-Tab öffnen
        2. Aufnahme starten
        3. ...
  - type: input
    id: version
    attributes:
      label: PIROL-Version
      description: Einstellungen → Info
      placeholder: z.B. 0.0.10
    validations:
      required: true
  - type: input
    id: geraet
    attributes:
      label: Gerät und Android-Version
      placeholder: z.B. Fairphone 5, Android 15
    validations:
      required: true
  - type: textarea
    id: anhang
    attributes:
      label: Screenshots, Aufnahme oder Log
      description: Hier hineinziehen. Bitte keine Standorte teilen, die geschützt bleiben sollen.
